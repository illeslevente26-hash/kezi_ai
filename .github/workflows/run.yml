name: Kezilabda AI Futtato

on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 14 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-ai:
    runs-on: ubuntu-latest

    steps:
      - name: Kod letoltese
        uses: actions/checkout@v4

      - name: Python beallitasa
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ellenorzes
        run: |
          pwd
          ls -la
          python --version

      - name: Csomagok telepitese
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy scipy

      - name: AI futtatasa
        run: python main.py