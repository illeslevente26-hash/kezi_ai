name: Kezilabda AI Futtato

on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 14 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-ai:
    runs-on: ubuntu-latest

    steps:
      - name: Kod letoltese
        uses: actions/checkout@v4

      - name: Python beallitasa
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fajlok ellenorzese
        run: |
          echo "Aktualis konyvtar:"
          pwd
          echo "Fajlok:"
          find . -maxdepth 2 -type f | sort

      - name: Python es pip ellenorzese
        run: |
          python --version
          pip --version

      - name: Csomagok telepitese
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy scipy

      - name: AI futtatasa
        run: |
          echo "Main inditasa..."
          python main.py